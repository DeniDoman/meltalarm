[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.6"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
meltalarm-model = { path = "crates/model" }
meltalarm-core = { path = "crates/core" }
meltalarm-source-api = { path = "crates/source-api" }
meltalarm-source-msi = { path = "crates/source-msi" }
meltalarm-source-sim = { path = "crates/source-sim" }
meltalarm-runtime = { path = "crates/runtime" }
meltalarm-lifecycle = { path = "crates/lifecycle" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
disallowed_methods = "deny"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
