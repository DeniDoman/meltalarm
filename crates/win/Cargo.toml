[package]
name = "meltalarm-win"
description = "MeltAlarm for Windows: tray, popup, alarm overlay, sound and voice"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "meltalarm"
path = "src/main.rs"

[features]
# Dev only: scripted readings instead of USB, runs without elevation. Never in releases.
simulate = []

[dependencies]
meltalarm-model.workspace = true
meltalarm-core.workspace = true
meltalarm-source-api.workspace = true
meltalarm-source-msi.workspace = true
meltalarm-runtime.workspace = true

windows-numerics = "0.3"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_Audio",
    "Win32_Media_Speech",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
